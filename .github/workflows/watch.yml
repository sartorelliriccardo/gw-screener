name: watch

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre l'ultima versione, anche se il giro era in coda

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa browser e lettore PDF
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q poppler-utils

      - name: Scarica le pagine IR con un browser vero
        run: python render.py
        continue-on-error: true

      - name: Controlla i siti
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python monitor.py

      - name: Rileva avvisi nuovi
        run: |
          if [ -n "$(git status --porcelain last_alert.txt)" ]; then echo "NEW_ALERT=1" >> "$GITHUB_ENV"; fi

      - name: Aggiorna la pagina
        run: python build_site.py

      - name: Salva stato e pagina
        run: |
          git config user.name "gorilla-watch"
          git config user.email "gorilla-watch@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "controllo $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "push non riuscito" && exit 1

      - name: Apri una segnalazione se ci sono modifiche
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$NEW_ALERT" = "1" ]; then
            head -c 60000 last_alert.txt > body.txt
            gh issue create --title "Modifica rilevata $(date -u +'%Y-%m-%d %H:%M') UTC" --body-file body.txt
          fi

